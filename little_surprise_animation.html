<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Little Surprise 💖</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;display:grid;place-items:center;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#170d25,#35152d,#120b1c);color:white}.card{text-align:center;width:min(92%,430px);padding:34px 24px;position:relative;z-index:2}.top{font-size:32px;animation:f 3s ease-in-out infinite}.heart{font-size:92px;filter:drop-shadow(0 0 20px #ff6fae);animation:b 1.2s infinite}h1{font-size:40px;margin:10px 0;background:linear-gradient(90deg,#fff,#ffc2df,#fff);-webkit-background-clip:text;color:transparent}.msg{font-size:19px;line-height:1.55}.small{margin-top:22px;font-size:14px;opacity:.7}.particle{position:fixed;bottom:-30px;animation:r linear infinite}@keyframes b{50%{transform:scale(1.16)}}@keyframes f{50%{transform:translateY(-9px)}}@keyframes r{to{transform:translateY(-115vh) rotate(360deg);opacity:0}}
</style></head><body><div class="card"><div class="top">🌸 ✨ 🌷 ✨ 🌸</div><div class="heart">💖</div><h1>Just for you...</h1><div class="msg">Tumhari smile hi kaafi hai kisi ka din beautiful banane ke liye. ✨<br><br>Bas aise hi hamesha smile karti rehna. 🌙💗</div><div class="small">A little surprise, made with a smile ✨</div></div><script>let a=["✨","💗","🌸","⭐","🌷"];for(let i=0;i<28;i++){let e=document.createElement("div");e.className="particle";e.textContent=a[i%5];e.style.left=Math.random()*100+"vw";e.style.fontSize=14+Math.random()*20+"px";e.style.animationDuration=4+Math.random()*5+"s";e.style.animationDelay=-Math.random()*8+"s";document.body.appendChild(e)}</script></body></html>
